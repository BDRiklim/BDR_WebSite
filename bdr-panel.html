<style>
/* Admin dashboard: navy sidebar, light workspace, one blue accent, Rethink Sans.
   Summary-first; state shown as pills/stripes; numbers tabular. Single light theme. */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#F7F9FD;
  --ink:#0E1B2E; --ink-2:#2B3B54; --muted:#5E6E86; --line:#E3E9F2; --line-2:#EEF2F8;
  --brand:#1B56C4; --brand-2:#0E3C94; --tint:#E9F1FD;
  --side:#0E1B2E; --side-2:#0A1626; --side-fg:#EAF1FB; --side-muted:#8EA1C0;
  --side-active:rgba(91,141,240,.18); --side-line:rgba(141,167,208,.14);
  --ok:#1F9D62; --ok-bg:#E4F5EC; --warn:#C27C16; --warn-bg:#FBF0DC;
  --bad:#D13D3D; --bad-bg:#FBE6E6; --info:#1B56C4; --info-bg:#E9F1FD; --neutral:#7B8AA3; --neutral-bg:#EEF1F6;
  --radius:13px; --radius-sm:9px;
  --shadow:0 18px 40px -26px rgba(14,27,46,.4); --shadow-sm:0 6px 16px -12px rgba(14,27,46,.5);
  --sans:"Rethink Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --sbw:248px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;font-size:14px}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%;display:block}
.tnum{font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}

/* layout */
.app{display:grid;grid-template-columns:var(--sbw) 1fr;min-height:100%}
/* sidebar */
.side{background:linear-gradient(180deg,var(--side),var(--side-2));color:var(--side-fg);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;border-right:1px solid var(--side-line);z-index:40}
.side .brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px}
.side .brand .mark{width:38px;height:38px;flex-shrink:0}
.side .brand .bt{font-weight:800;font-size:1.18rem;line-height:1}
.side .brand .bs{font-size:.54rem;letter-spacing:.3em;color:var(--side-muted);text-transform:uppercase;margin-top:3px;font-weight:600}
.navscroll{overflow-y:auto;flex:1;padding:6px 12px 14px}
.navgrp{margin-top:16px}
.navgrp .lbl{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);padding:0 10px 7px;font-weight:600}
.navlink{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--side-fg);opacity:.82;
  font-weight:500;font-size:.9rem;transition:background .15s,opacity .15s;border:none;background:none;width:100%;text-align:left}
.navlink:hover{opacity:1;background:rgba(255,255,255,.05)}
.navlink.active{opacity:1;background:var(--side-active);color:#fff;box-shadow:inset 2px 0 0 var(--brand)}
.navlink svg{width:18px;height:18px;flex-shrink:0;opacity:.9}
.navlink .badge{margin-left:auto;background:var(--brand);color:#fff;font-size:.68rem;font-weight:700;border-radius:999px;padding:.05em .5em;min-width:20px;text-align:center}
.side .foot{border-top:1px solid var(--side-line);padding:12px;display:flex;align-items:center;gap:10px}
.side .foot .av{width:36px;height:36px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0}
.side .foot .nm{font-size:.84rem;font-weight:600;line-height:1.2}
.side .foot .rl{font-size:.72rem;color:var(--side-muted)}

/* main */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px clamp(14px,3vw,28px)}
.topbar h1{font-size:1.18rem}
.topbar .sub{font-size:.8rem;color:var(--muted);margin-top:1px}
.topbar .sp{flex:1}
.tb-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:9px;padding:.5em .85em;font-size:.86rem;font-weight:600}
.tb-btn:hover{border-color:var(--brand);color:var(--brand)}
.tb-btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.tb-btn.primary:hover{background:var(--brand-2);color:#fff}
.tb-ic{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;color:var(--ink-2)}
.tb-ic .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;background:var(--bad);border-radius:50%;border:2px solid var(--surface)}
.burger{display:none}
.content{padding:clamp(16px,3vw,28px);max-width:1280px;width:100%}
.view{display:none}.view.active{display:block}

/* cards & grids */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow-sm)}
.kpi .t{font-size:.76rem;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.kpi .t .i{width:28px;height:28px;border-radius:8px;background:var(--tint);color:var(--brand);display:grid;place-items:center;margin-left:auto}
.kpi .v{font-size:1.7rem;font-weight:800;margin-top:10px;letter-spacing:-.02em}
.kpi .d{font-size:.74rem;margin-top:5px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.up{color:var(--ok)}.down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.panel .ph{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line-2)}
.panel .ph h3{font-size:1rem}
.panel .ph .sp{flex:1}
.panel .pb{padding:16px 18px}
.link{color:var(--brand);font-weight:600;font-size:.82rem}

/* chart */
.chart{width:100%;height:230px}
.chart text{font-family:var(--sans)}
.ttip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;border-radius:8px;padding:7px 10px;font-size:.78rem;
  font-weight:600;opacity:0;transition:opacity .12s;z-index:60;white-space:nowrap;box-shadow:var(--shadow)}

/* table */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;
  padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
.cust{font-weight:600}
.sub2{font-size:.76rem;color:var(--muted)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;border-radius:999px;padding:.24em .7em;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--ok-bg)} .p-warn{color:var(--warn);background:var(--warn-bg)}
.p-bad{color:var(--bad);background:var(--bad-bg)} .p-info{color:var(--info);background:var(--info-bg)}
.p-neutral{color:var(--neutral);background:var(--neutral-bg)}
select.statusel{font-family:inherit;font-size:.78rem;font-weight:600;border:1px solid var(--line);border-radius:7px;padding:.3em .5em;background:var(--surface);color:var(--ink)}

/* pipeline */
.pipe{display:grid;gap:10px}
.pipe .row{display:flex;align-items:center;gap:12px}
.pipe .nm{width:118px;font-size:.84rem;font-weight:600;flex-shrink:0}
.pipe .bar{flex:1;height:22px;background:var(--line-2);border-radius:6px;overflow:hidden}
.pipe .bar i{display:block;height:100%;border-radius:6px}
.pipe .ct{width:30px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* buttons small */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:.5em .85em;font-size:.82rem;font-weight:600;border:1px solid transparent}
.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-2)}
.btn-line{background:var(--surface);border-color:var(--line);color:var(--ink)}.btn-line:hover{border-color:var(--brand);color:var(--brand)}
.btn-sm{padding:.34em .6em;font-size:.76rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:30px;height:30px;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--brand);color:var(--brand)}

/* product/reference cards */
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.pcard .im{aspect-ratio:16/10;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);border-bottom:1px solid var(--line-2);overflow:hidden}
.pcard .im img{width:100%;height:100%;object-fit:cover}
.pcard .bd{padding:13px 14px}
.pcard h4{font-size:.95rem}
.pcard .meta{font-size:.76rem;color:var(--muted);margin-top:3px}
.pcard .pr{font-weight:800;margin-top:9px}

/* brand chips */
.brandlist{display:flex;flex-wrap:wrap;gap:10px}
.bchip{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);font-weight:600}
.bchip.off{opacity:.45}
.bchip .tg{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex-shrink:0;border:none}
.bchip .tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.bchip.on .tg{background:var(--brand)}.bchip.on .tg::after{left:16px}
.bchip .x{color:var(--muted);border:none;background:none;font-size:1.1rem;line-height:1}

/* forms */
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld.full{grid-column:1/-1}
.fld label{font-size:.8rem;font-weight:600;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{font-family:inherit;font-size:.9rem;padding:.6em .75em;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
.fld .hint{font-size:.74rem;color:var(--muted)}
.dropzone{border:1.5px dashed var(--line);border-radius:10px;padding:20px;text-align:center;color:var(--muted);background:var(--surface-2);font-size:.84rem}
.dropzone b{color:var(--brand)}
.mediarow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mediathumb{width:120px;height:72px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:#000}
.mediathumb img,.mediathumb video{width:100%;height:100%;object-fit:cover}

/* settings toggles */
.setrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.setrow:last-child{border-bottom:none}
.setrow .tx b{font-size:.92rem}.setrow .tx small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.setrow .sp{flex:1}
.tog{width:44px;height:25px;border-radius:999px;background:var(--line);position:relative;border:none;flex-shrink:0;transition:background .15s}
.tog::after{content:"";position:absolute;top:2.5px;left:2.5px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog.on{background:var(--brand)}.tog.on::after{left:21.5px}

/* toast + modal */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:.8em 1.2em;border-radius:10px;font-weight:600;font-size:.88rem;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:90;display:flex;align-items:center;gap:9px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{color:#5ce39b}
.modal{position:fixed;inset:0;background:rgba(10,18,30,.5);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal.open{display:flex}
.modal .box{background:var(--surface);border-radius:var(--radius);width:100%;max-width:480px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal .mh{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.modal .mh h3{font-size:1.05rem}.modal .mh .x{margin-left:auto;border:none;background:none;font-size:1.4rem;color:var(--muted);line-height:1}
.modal .mb{padding:18px}
.modal .mf{padding:14px 18px;border-top:1px solid var(--line-2);display:flex;justify-content:flex-end;gap:10px}

.sec-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.sec-head .sp{flex:1}
.note{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:.5em .8em;background:var(--surface)}
.note svg{color:var(--brand);flex-shrink:0}
.minib{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}

@media (max-width:1080px){ .kpis{grid-template-columns:repeat(3,1fr)} .grid2{grid-template-columns:1fr} }
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:260px;transform:translateX(-100%);transition:transform .22s;box-shadow:var(--shadow)}
  .side.open{transform:translateX(0)}
  .burger{display:grid}
  .kpis,.minib{grid-template-columns:repeat(2,1fr)}
  .formgrid{grid-template-columns:1fr}
  .scrim{position:fixed;inset:0;background:rgba(10,18,30,.45);z-index:35;display:none}
  .scrim.show{display:block}
}
@media (max-width:520px){ .kpis,.minib{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- bar chart (single series) ---------- */
function barChart(data,labels,fmt){
  var W=640,H=230,pl=44,pr=14,pt=16,pb=28, iw=W-pl-pr, ih=H-pt-pb;
  var max=Math.max.apply(null,data)*1.12, bw=iw/data.length;
  var grid="";
  for(var g=0;g<=4;g++){var gy=pt+ih-ih*(g/4), val=Math.round(max*g/4);
    grid+='<line x1="'+pl+'" y1="'+gy+'" x2="'+(W-pr)+'" y2="'+gy+'" stroke="var(--line)" stroke-width="1"/>';
    grid+='<text x="'+(pl-8)+'" y="'+(gy+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+val+'</text>';
  }
  var bars="";
  data.forEach(function(v,i){
    var bh=ih*(v/max), x=pl+i*bw+bw*0.22, y=pt+ih-bh, w=bw*0.56;
    bars+='<rect class="bar" data-i="'+i+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="4" fill="var(--brand)"/>';
    bars+='<text x="'+(pl+i*bw+bw/2).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'+labels[i]+'</text>';
  });
  var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Aylık ciro grafiği">'+grid+bars+'</svg>';
  return svg;
}
function wireChart(root,data,fmt){
  var tip=document.getElementById("ttip");
  root.querySelectorAll("rect.bar").forEach(function(r){
    r.style.cursor="pointer";
    r.addEventListener("mousemove",function(e){
      var i=+r.getAttribute("data-i");
      tip.textContent=fmt(data[i]); tip.style.opacity="1";
      tip.style.left=(e.clientX+12)+"px"; tip.style.top=(e.clientY-10)+"px";
      r.setAttribute("fill","var(--brand-2)");
    });
    r.addEventListener("mouseleave",function(){tip.style.opacity="0";r.setAttribute("fill","var(--brand)");});
  });
}

/* ---------- router ---------- */
function buildNav(){
  var c=counts(), html="";
  NAV.forEach(function(g){
    html+='<div class="navgrp"><div class="lbl">'+g.grp+'</div>';
    g.items.forEach(function(it){
      var badge="";
      if(it[3]==="crmCount")badge='<span class="badge">'+(c.Yeni+c.Arandı)+'</span>';
      if(it[3]==="msgCount")badge='<span class="badge">'+mesajlar.filter(function(m){return !m.okundu;}).length+'</span>';
      if(it[3]==="bakimCount")badge='<span class="badge">'+bakimlar.filter(function(b){return b.durum!=="Planlı";}).length+'</span>';
      html+='<button class="navlink" data-view="'+it[0]+'">'+ic(it[2])+'<span>'+it[1]+'</span>'+badge+'</button>';
    });
    html+='</div>';
  });
  document.getElementById("nav").innerHTML=html;
}
function go(v){
  if(!views[v])v="dash";
  document.querySelectorAll(".navlink").forEach(function(n){n.classList.toggle("active",n.getAttribute("data-view")===v);});
  document.getElementById("pgTitle").textContent=TITLES[v][0];
  document.getElementById("pgSub").textContent=TITLES[v][1];
  var content=document.getElementById("content");
  content.innerHTML='<div class="view active">'+views[v]()+'</div>';
  if(v==="dash"){var rc=document.getElementById("revChart");rc.innerHTML=barChart(gelirAylik,aylar);wireChart(rc,gelirAylik,function(x){return TL(x*1000);});}
  if(v==="muhasebe"){var r2=document.getElementById("revChart2");r2.innerHTML=barChart(gelirAylik,aylar);wireChart(r2,gelirAylik,function(x){return TL(x*1000);});}
  try{location.hash=v;}catch(e){}
  closeSide();
  window.scrollTo(0,0);
}

/* ---------- interactions ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-view],[data-go],[data-add],[data-remind],[data-read],[data-tomsg],[data-save],[data-teklif],[data-bx],[data-up],[data-info],[data-bi]");
  if(!t)return;
  if(t.hasAttribute("data-view"))return go(t.getAttribute("data-view"));
  if(t.hasAttribute("data-go"))return go(t.getAttribute("data-go"));
  if(t.hasAttribute("data-bi")){var i=+t.getAttribute("data-bi");markalar[i].on=!markalar[i].on;document.getElementById("brandList").innerHTML=brandChips();toast(markalar[i].ad+(markalar[i].on?" sitede gösteriliyor":" gizlendi"));return;}
  if(t.hasAttribute("data-bx")){var j=+t.getAttribute("data-bx");var nm=markalar[j].ad;markalar.splice(j,1);document.getElementById("brandList").innerHTML=brandChips();toast(nm+" kaldırıldı");return;}
  if(t.hasAttribute("data-read")){var id=+t.getAttribute("data-read");var m=mesajlar.filter(function(x){return x.id===id;})[0];if(m)m.okundu=true;document.getElementById("msgBody").innerHTML=msgRows();buildNav();toast("Mesaj okundu işaretlendi");return;}
  if(t.hasAttribute("data-tomsg")){toast("Mesaj talebe dönüştürüldü (CRM)");return;}
  if(t.hasAttribute("data-teklif")){toast("Teklif taslağı oluşturuldu (PDF)");return;}
  if(t.hasAttribute("data-remind")){toast(t.getAttribute("data-remind")+" · bakım hatırlatması gönderildi");return;}
  if(t.hasAttribute("data-save")){toast("Değişiklikler yayınlandı — site güncellendi");return;}
  if(t.hasAttribute("data-up")){toast("Yükleme alanı (demo) — gerçek sürümde dosya seçilir");return;}
  if(t.hasAttribute("data-info")){toast("Entegrasyon gerçek sürümde kurulacak");return;}
  if(t.hasAttribute("data-add"))return openAdd(t.getAttribute("data-add"));
});
document.addEventListener("change",function(e){
  var s=e.target.closest("select.statusel");
  if(!s)return;
  var id=+s.getAttribute("data-id"), v=s.value;
  var tp=talepler.filter(function(x){return x.id===id;})[0]; if(tp)tp.durum=v;
  buildNav(); toast("Durum güncellendi: "+v);
});

var curAdd=null;
function openAdd(key){
  var d=addDefs[key]; if(!d)return; curAdd=d;
  document.getElementById("mTitle").textContent=d.title;
  document.getElementById("mBody").innerHTML='<div class="formgrid" style="grid-template-columns:1fr">'+d.fields.map(function(f){
    if(f[1]==="select")return '<div class="fld"><label>'+f[0]+'</label><select>'+f[2].map(function(o){return '<option>'+o+'</option>';}).join("")+'</select></div>';
    return '<div class="fld"><label>'+f[0]+'</label><input placeholder="'+f[0]+'"></div>';
  }).join("")+'</div>';
  modal.classList.add("open");
}
function closeModal(){modal.classList.remove("open");}
document.getElementById("mClose").addEventListener("click",closeModal);
document.getElementById("mCancel").addEventListener("click",closeModal);
modal.addEventListener("click",function(e){if(e.target===modal)closeModal();});
document.getElementById("mSave").addEventListener("click",function(){var ok=curAdd?curAdd.ok:"Kaydedildi";closeModal();toast(ok+" (önizleme)");});

/* ---------- sidebar mobile ---------- */
function closeSide(){document.getElementById("side").classList.remove("open");document.getElementById("scrim").classList.remove("show");}

/* ---------- init ---------- */
buildNav();
var start=(location.hash||"").replace("#","");
go(views[start]?start:"dash");
})();
